<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业·风格轮动模型看板</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--line:#e6e8eb;--txt:#1f2329;--sub:#6b7280;
        --combo:#c0392b;--ind:#e07b00;--style:#2e7d32;--bench:#9aa0a6;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
  h1{font-size:20px;margin:0 0 6px}
  h2{font-size:15px;margin:26px 0 10px;padding-left:8px;border-left:3px solid #c7ccd1}
  .meta{color:var(--sub);font-size:13px}
  .meta b{color:var(--txt);font-weight:600}
  .env{display:inline-block;padding:1px 8px;border-radius:10px;background:#eef1f4;color:#374151;font-size:12px;margin-left:6px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:760px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .card .sub{color:var(--sub);font-size:12px;margin-bottom:8px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:5px 4px;text-align:right;font-size:13px;border-bottom:1px solid #f0f1f3}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--sub);font-weight:500;font-size:12px}
  tbody tr:last-child td{border-bottom:none}
  .w{font-variant-numeric:tabular-nums}
  .etf{color:var(--sub);font-size:11.5px}
  .cash{color:var(--sub);font-size:12px;margin-top:6px}
  .up{color:#c0392b}.down{color:#2e7d32}
  .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
  .ctrl label{color:var(--sub)}
  .ctrl input,.ctrl select{border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:13px;background:#fff;color:var(--txt)}
  .ctrl button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .ctrl button.on{background:#1f2329;border-color:#1f2329;color:#fff}
  svg{width:100%;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 0;font-size:12.5px;color:var(--sub)}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
  .legend b{font-variant-numeric:tabular-nums;font-weight:600}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hint{color:var(--sub);font-size:12px;margin-top:6px}
  .rankwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.rankwrap{grid-template-columns:1fr}}
  .rankbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-height:460px;overflow:auto}
  .rankbox h3{margin:2px 0 8px;font-size:14px}
  .pctbar{position:relative;height:3px;background:#f0f1f3;border-radius:2px;margin-top:2px}
  .pctbar i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:#b9c0c7}
  footer{color:var(--sub);font-size:12px;margin-top:26px;text-align:center}
  .muted{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>行业·风格轮动模型看板</h1>
    <div class="meta">
      生成时间 <b id="mUpd">—</b> ｜ 数据区间 <b id="mRange">—</b>
      <span class="env" id="mEnv"></span>
    </div>
  </header>

  <h2>推荐持仓</h2>
  <div class="box">
    <div class="ctrl">
      <label>持仓日期</label>
      <input type="date" id="pickDate">
      <button id="bLatest">最新</button>
      <span class="hint" id="pickHint">可选任意历史交易日，查看当天的推荐持仓与打分排名</span>
    </div>
    <div class="cards" id="holdCards"></div>
  </div>

  <h2>净值曲线</h2>
  <div class="box">
    <div class="ctrl">
      <label>区间</label>
      <input type="date" id="cStart"><label>至</label><input type="date" id="cEnd">
      <button data-q="ytd">年初以来</button><button data-q="1y">近1年</button>
      <button data-q="3y">近3年</button><button data-q="5y">近5年</button><button data-q="all">全部</button>
    </div>
    <div class="ctrl">
      <label>基准</label><select id="benchSel"></select>
      <label>显示</label>
      <select id="viewSel">
        <option value="nav">净值曲线</option>
        <option value="excess">超额曲线</option>
        <option value="relative">相对净值(组合÷基准)</option>
        <option value="drawdown">回撤曲线</option>
      </select>
    </div>
    <svg id="chart" viewBox="0 0 860 360"></svg>
    <div class="legend" id="legend"></div>
    <div class="hint" id="chartHint"></div>
    <div class="scrollx"><table id="metrics" style="margin-top:10px;white-space:nowrap"></table></div>
  </div>

  <h2>组合表现 &amp; 对比指数</h2>
  <div class="box">
    <div class="ctrl">
      <label>截止日期</label><input type="date" id="perfDate">
      <span class="hint">三模型并列 vs 四条宽基指数，各周期收益率</span>
    </div>
    <div class="scrollx"><table id="perfTable" style="white-space:nowrap"></table></div>
  </div>

  <h2>最新 10 个交易日 日涨跌</h2>
  <div class="box">
    <div class="hint" style="margin-top:0">模型为模拟净值；红色=上涨，绿色=下跌。</div>
    <div class="scrollx"><table id="recentTable" style="margin-top:8px;white-space:nowrap"></table></div>
  </div>

  <h2>打分排名（行业 · 申万一级）</h2>
  <div class="box"><table id="rankInd"></table></div>

  <h2>大盘择时（上证50 / 中证800）</h2>
  <div class="box" id="timingBox">
    <div class="hint" style="margin-top:0">择时状态与历史表现：实线＝择时策略，虚线＝买入持有（起点＝1，对数轴）。</div>
    <div class="scrollx"><table id="timingTable" style="margin-top:8px;white-space:nowrap"></table></div>
    <svg id="timingChart" viewBox="0 0 860 320" style="margin-top:12px"></svg>
    <div class="legend" id="timingLegend"></div>
  </div>

  <h2>顶底极值判断（阶段顶 / 阶段底）</h2>
  <div class="box" id="extremeBox">
    <div class="hint" style="margin-top:0">底部得分 0~1，越高越接近阶段底；红点＝顶部风险触发日。</div>
    <div class="scrollx"><table id="extremeTable" style="margin-top:8px;white-space:nowrap"></table></div>
    <svg id="extremeChart" viewBox="0 0 860 300" style="margin-top:12px"></svg>
    <div class="legend" id="extremeLegend"></div>
  </div>

  <footer>仅供个人研究参考，不构成投资建议。数据每日盘前自动更新。</footer>
</div>

// ---------- 快照：持仓 + 环境 + 排名 ----------
function nearest(arr, target){
  for(let i=arr.length-1;i>=0;i--){ if(arr[i] <= target) return arr[i]; }
  return arr[0];
}
function etfText(list){
  if(!list || !list.length) return '';
  return list.map(e => e['场内'] || e['名'] || e['名称'] || '').filter(Boolean).join(' / ');
}
function holdRows(hold, isInd){
  if(!hold.length) return '<tr><td colspan="3" class="cash">当日空仓</td></tr>';
  return hold.map(h=>{
    const ci = h[0], w = h[1], sc = h[2];
    const name = isInd ? IND_NAME(ci) : STY_NAME(ci);
    const etf = isInd ? etfText(D.ind_etf[name]) : etfText(D.sty_etf[name] ? [D.sty_etf[name]] : []);
    return `<tr><td>${name}${etf?`<div class="etf">${etf}</div>`:''}</td>
      <td class="w">${fmtNum(w)}%</td><td class="w">${sc==null?'—':fmtNum(sc)}</td></tr>`;
  }).join('');
}
function holdTable(hold, isInd){
  return `<table><thead><tr><th>标的</th><th>权重</th><th>打分</th></tr></thead>
          <tbody>${holdRows(hold, isInd)}</tbody></table>`;
}
function renderSnapshot(dateStr){
  const di = nearest(IND_DATES, dateStr);
  const ds = nearest(STY_DATES, dateStr);
  const ir = D.ind_hist[di] || {e:'', h:[], r:[], s:[]};
  const sr = D.sty_hist[ds] || {e:'', h:[], r:[], s:[]};
  $('mEnv').textContent = ir.e ? ('市场环境：' + ir.e) : '';
  $('pickHint').textContent = (di !== dateStr)
    ? ('已取最近交易日 ' + di + '（' + (ir.e||'') + '）') : ('交易日 ' + di);

  const indHold = ir.h || [], styHold = sr.h || [];
  const sumInd = indHold.reduce((a,b)=>a+(b[1]||0),0);
  const sumSty = styHold.reduce((a,b)=>a+(b[1]||0),0);
  const combined = indHold.map(h=>({name:IND_NAME(h[0]), etf:etfText(D.ind_etf[IND_NAME(h[0])]),
                                    w:(h[1]||0)*0.5, sc:h[2]}))
    .concat(styHold.map(h=>({name:STY_NAME(h[0]),
                             etf:etfText(D.sty_etf[STY_NAME(h[0])] ? [D.sty_etf[STY_NAME(h[0])]] : []),
                             w:(h[1]||0)*0.5, sc:h[2]})));
  const comboRows = combined.length ? combined.map(x=>
      `<tr><td>${x.name}${x.etf?`<div class="etf">${x.etf}</div>`:''}</td>
       <td class="w">${fmtNum(x.w)}%</td><td class="w">${x.sc==null?'—':fmtNum(x.sc)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="cash">当日空仓</td></tr>';

  const cards = [
    {color:'#e07b00', title:'行业轮动', sub:'Top5 分数加权 · 行业腿',
     body: holdTable(indHold, true), cash: Math.max(0, 100-sumInd)},
    {color:'#2e7d32', title:'风格轮动', sub: sr.p || '风格腿',
     body: holdTable(styHold, false), cash: Math.max(0, 100-sumSty)},
    {color:'#c0392b', title:'双层组合', sub:'行业腿 50% + 风格腿 50%',
     body: `<table><thead><tr><th>标的</th><th>权重</th><th>打分</th></tr></thead><tbody>${comboRows}</tbody></table>`,
     cash: Math.max(0, 100 - (sumInd+sumSty)/2)},
  ];
  $('holdCards').innerHTML = cards.map(c=>`
    <div class="card">
      <h3><span class="dot" style="background:${c.color}"></span>${c.title}</h3>
      <div class="sub">${c.sub}</div>
      ${c.body}
      ${c.cash>0.05?`<div class="cash">现金 ${fmtNum(c.cash)}%</div>`:''}
    </div>`).join('');

  renderRank($('rankInd'), (ir.r||[]).map((ci,k)=>[IND_NAME(ci), (ir.s||[])[k]]));

  // 曲线默认跟随该日期
  $('perfDate').value = di;
  $('cEnd').value = di;
  renderPerf();
  drawCurves();
}
function renderRank(el, rows){
  if(!rows.length){ el.innerHTML = '<tbody><tr><td class="muted">无数据</td></tr></tbody>'; return; }
  const max = Math.max(1, ...rows.map(r=>Math.abs(r[1]||0)));
  el.innerHTML = '<thead><tr><th>名称</th><th>打分</th><th style="width:52px"></th></tr></thead><tbody>' +
    rows.map((r,i)=>{
      const wdt = Math.min(100, Math.abs(r[1]||0)/max*100);
      return `<tr><td>${i+1}. ${r[0]}</td><td class="w">${fmtNum(r[1])}</td>
              <td><div class="pctbar"><i style="width:${wdt}%"></i></div></td></tr>`;
    }).join('') + '</tbody>';
}

// ---------- 周期收益工具 ----------
const PERIODS = [
  {type:'ytd', label:'年初至今'}, {days:5, label:'近一周'}, {days:20, label:'近一月'},
  {days:63, label:'近三月'}, {days:120, label:'近半年'}, {days:247, label:'近一年'},
  {days:741, label:'近三年'}, {days:1235, label:'近五年'},
];
function idxOnOrAfter(target){
  for(let i=0;i<CD.dates.length;i++){ if(CD.dates[i] >= target) return i; }
  return -1;
}
function periodReturn(arr, endDate, p){
  const ei = idxOnOrAfter(endDate);
  if(ei < 0) return null;
  if(p.type === 'ytd'){
    const yy = CD.dates[ei].slice(0,4);
    let si = -1; for(let i=0;i<=ei;i++){ if(CD.dates[i].slice(0,4) === yy && si < 0) { si = i; break; } }
    if(si < 0 || si > ei) return null;
    return arr[ei]/arr[si]-1;
  }
  if(ei - p.days < 0) return null;
  return arr[ei]/arr[ei-p.days]-1;
}
const SERIES4 = [
  {key:'combo', name:'双层组合', color:'#c0392b'},
  {key:'ind',   name:'行业轮动', color:'#e07b00'},
  {key:'style', name:'风格轮动', color:'#2e7d32'},
];
const BENCH_C = '#156082';

// ---------- 组合表现 & 对比指数 ----------
function renderPerf(){
  if(!CD.dates || !CD.dates.length) return;
  const d = val('perfDate') || CD.dates[CD.dates.length-1];
  const benchCodes = Object.keys(CD.bench);
  let h = `<thead><tr><th>周期</th>`;
  SERIES4.forEach(m => h += `<th style="color:${m.color}">${m.name}</th>`);
  benchCodes.forEach(c => h += `<th>${CD.bench_names[c]||c}</th>`);
  h += '</tr></thead><tbody>';
  PERIODS.forEach(p => {
    h += `<tr><td>${p.label}</td>`;
    SERIES4.forEach(m => { const v = periodReturn(CD[m.key], d, p); 
      h += `<td class="w" style="font-weight:700">${v==null?'—':`<span class="${v>=0?'up':'down'}">${fmtPct(v)}</span>`}</td>`; });
    benchCodes.forEach(c => { const v = periodReturn(CD.bench[c], d, p);
      h += `<td class="w">${v==null?'—':fmtPct(v)}</td>`; });
    h += '</tr>';
  });
  $('perfTable').innerHTML = h + '</tbody>';
}

// ---------- 最近 10 日 ----------
(function renderRecent(){

    });
    h += '</tr>';
  });
  $('recentTable').innerHTML = h + '</tbody>';
})();

// ---------- 净值曲线 ----------
function sliceDates(s, e){
  const n = CD.dates.length;
  if(!s) s = CD.dates[0];
  if(!e) e = CD.dates[n-1];
  if(s > e){ const t = s; s = e; e = t; }
  let lo = CD.dates.findIndex(x => x >= s); if(lo < 0) lo = 0;
  let hi = CD.dates.findIndex(x => x > e);  if(hi < 0) hi = n;
  if(hi - lo < 2) { hi = Math.min(n, lo + 2); }
  return {lo, hi};
}
function maxDD(nav){
  let peak = nav[0], dd = [0];
  for(let i=1;i<nav.length;i++){ peak = Math.max(peak, nav[i]); dd.push(nav[i]/peak - 1); }
  return dd;
}
function annRet(vals){ return Math.pow(vals[vals.length-1]/vals[0], 252/(vals.length-1||1)) - 1; }
function vol(vals){ const r=[]; for(let i=1;i<vals.length;i++) r.push(vals[i]/vals[i-1]-1);
  if(r.length<2) return 0; const m=r.reduce((a,b)=>a+b,0)/r.length;
  const v=r.reduce((a,b)=>a+(b-m)*(b-m),0)/(r.length-1); return Math.sqrt(v*252); }
function mdd(vals){ return Math.min(...maxDD(vals)); }
function sharp(vals){ const v=vol(vals); return v>0 ? annRet(vals)/v : 0; }
function normArr(arr, lo, hi){ const a0 = arr[lo]||1; const o=[]; for(let i=lo;i<hi;i++) o.push(arr[i]/a0); return o; }

function drawSVG(labels, series){
  const n = series[0].y.length;
  const W = Math.max(320, Math.round($('chart').clientWidth) || 860);
  const H = W < 560 ? 250 : 340;
  $('chart').setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('chart').style.height = H + 'px';
  const padL = W<560?42:52, padR = 12, padT = 14, padB = 26;
  let min=Infinity, max=-Infinity;
  series.forEach(s=>s.y.forEach(v=>{ if(v!=null&&isFinite(v)){min=Math.min(min,v);max=Math.max(max,v);} }));
  if(!isFinite(min)||!isFinite(max)) return '<p class="muted">区间内无有效数据</p>';
  if(max===min){ max+=0.01; min-=0.01; }
  const rng = max-min;
  const X = i => padL + (n<2?0:i/(n-1))*(W-padL-padR);
  const Y = v => padT + (max-v)/rng*(H-padT-padB);
  let u = '';
  for(let g=0;g<=4;g++){
    const yy = padT + g/4*(H-padT-padB), vv = max - g/4*rng;
    u += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#eef0f2"/>`;
    u += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0a6">${vv.toFixed(2)}</text>`;
  }
  [0, Math.floor((n-1)/2), n-1].forEach((i,k)=>{
    u += `<text x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="${k===0?'start':(k===2?'end':'middle')}" font-size="10" fill="#9aa0a6">${labels[i]}</text>`;
  });
  series.forEach(s=>{
    const pts=[]; s.y.forEach((v,i)=>{ if(v!=null&&isFinite(v)) pts.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`); });
    if(pts.length>1) u += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  });
  return u;
}
function drawCurves(){
  if(!CD.dates || !CD.dates.length) return;
  const bench = val('benchSel') || CD.default_bench;
  const view = val('viewSel');
  const {lo, hi} = sliceDates(val('cStart'), val('cEnd'));
  const dl = CD.dates.slice(lo, hi);
  const bFull = CD.bench[bench] || CD.bench[CD.default_bench];
  const bN = normArr(bFull, lo, hi);
  let series = [], viewTxt = '';
  if(view === 'drawdown'){
    SERIES4.forEach(m => series.push({name:m.name, color:m.color, y:maxDD(CD[m.key].slice(lo,hi))}));
    series.push({name:CD.bench_names[bench]||bench, color:BENCH_C, y:maxDD(bFull.slice(lo,hi))});
    viewTxt = '回撤（自区间起点算）';
  } else if(view === 'excess'){
    SERIES4.forEach(m => { const mn = normArr(CD[m.key], lo, hi); series.push({name:m.name+' 超额', color:m.color, y:mn.map((v,i)=>v-bN[i])}); });
    viewTxt = '累计超额（组合增速 − 基准增速）';
  } else if(view === 'relative'){
    SERIES4.forEach(m => { const mn = normArr(CD[m.key], lo, hi); series.push({name:m.name+' 相对', color:m.color, y:mn.map((v,i)=>v/bN[i])}); });
    viewTxt = '相对净值（>1 领先基准）';
  } else {
    SERIES4.forEach(m => series.push({name:m.name, color:m.color, y:normArr(CD[m.key], lo, hi)}));
    series.push({name:CD.bench_names[bench]||bench, color:BENCH_C, y:bN});
    viewTxt = '净值（起点归一=1）';
  }
  $('chart').innerHTML = drawSVG(dl, series);
  const last = s => s.y[s.y.length-1];
  $('legend').innerHTML = series.map(s=>`<span><i style="background:${s.color}"></i>${s.name} <b>${fmtNum(last(s))}</b></span>`).join('');
  $('chartHint').textContent = `区间 ${dl[0]} ~ ${dl[dl.length-1]}（${dl.length} 个交易日）｜ ${viewTxt}｜ 基准 ${CD.bench_names[bench]||bench}`;
  renderMetrics(lo, hi, dl, bench);
}
function renderMetrics(lo, hi, dl, bench){
  const b = normArr(CD.bench[bench]||CD.bench[CD.default_bench], lo, hi);
  const rows = [['区间收益率', v=>fmtPct(v[0]==null?null:v[v.length-1]/v[0]-1)],
                ['年化收益率', v=>fmtPct(annRet(v))],
                ['最大回撤',   v=>fmtPct(mdd(v))],
                ['年化波动率', v=>(vol(v)*100).toFixed(1)+'%'],
                ['夏普比率',   v=>sharp(v).toFixed(2)]];
  let h = '<thead><tr><th>指标</th>';
  SERIES4.forEach(m => h += `<th style="color:${m.color}">${m.name}</th>`);
  h += `<th>${CD.bench_names[bench]||bench}</th><th>超额(双层-基准)</th></tr></thead><tbody>`;
  const comboN = normArr(CD.combo, lo, hi);
  rows.forEach(r => {
    h += `<tr><td>${r[0]}</td>`;
    SERIES4.forEach(m => h += `<td class="w">${r[1](normArr(CD[m.key], lo, hi))}</td>`);
    h += `<td class="w">${r[1](b)}</td>`;
    let ex;
    if(r[0]==='区间收益率'){ ex = fmtPct(comboN[comboN.length-1]-b[b.length-1]); }
    else if(r[0]==='年化收益率'){ ex = fmtPct(annRet(comboN)-annRet(b)); }
    else if(r[0]==='最大回撤'){ ex = fmtPct(mdd(comboN)-mdd(b)); }
    else if(r[0]==='夏普比率'){ ex = (sharp(comboN)-sharp(b)).toFixed(2); }
    else { ex = '—'; }
    h += `<td class="w" style="font-weight:600">${ex}</td></tr>`;
  });
  $('metrics').innerHTML = h + '</tbody>';
}

// ---------- 大盘择时 ----------
function renderTiming(){
  const box = document.getElementById('timingBox');
  const T = D.timing;
  if(!T || !T.indices || !Object.keys(T.indices).length){ if(box) box.style.display = 'none'; return; }
  const rows = Object.entries(T.indices).map(([nm, v]) => {
    const pos = v.pos == null ? '—' : (v.pos*100).toFixed(1) + '%';
    const gate = v.gate ? '<span class="up">多头</span>' : '<span class="down">防守</span>';
    const f2 = x => (x==null) ? '—' : Number(x).toFixed(2);
    return `<tr>
      <td>${nm}<div class="etf">${v.code||''}</div></td>
      <td>${v.last_close==null?'—':Number(v.last_close).toFixed(2)}</td>
      <td>${gate}</td>
      <td class="w" style="font-weight:700;color:#156082">${pos}</td>
      <td class="w">${fmtPct(v.ret)}</td><td class="w">${f2(v.sharpe)}</td><td class="w">${fmtPct(v.mdd)}</td>
      <td class="w muted">${fmtPct(v.bh_ret)}</td><td class="w muted">${f2(v.bh_sharpe)}</td><td class="w muted">${fmtPct(v.bh_mdd)}</td>
      <td class="w">${fmtPct(v.avg_pos)}</td><td class="w">${f2(v.turnover)}</td>
    </tr>`;
  }).join('');
  document.getElementById('timingTable').innerHTML =
    `<thead>
      <tr><th>指数</th><th>收盘</th><th>趋势</th><th>建议仓位</th>
          <th colspan="3" style="text-align:center">择时策略</th>
          <th colspan="3" style="text-align:center">买入持有</th>
          <th>平均仓位</th><th>年换手</th></tr>
      <tr><th></th><th></th><th></th><th></th>
          <th>年化</th><th>夏普</th><th>回撤</th><th>年化</th><th>夏普</th><th>回撤</th>
          <th></th><th></th></tr>
     </thead><tbody>${rows}</tbody>`;
  drawTiming();
}
function drawTiming(){
  const el = document.getElementById('timingChart');
  const T = D.timing;
  if(!el || !T) return;
  const names = Object.keys(T.indices);
  const W = Math.max(320, Math.round(el.clientWidth) || 860);
  const H = W < 560 ? 240 : 320;
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.style.height = H + 'px';
  const L = W<560?42:52, R = 12, TT = 14, BB = 26;
  const colors = ['#c0392b','#9aa0a6','#156082','#2e7d32'];
  const series = []; let ci = 0;
  names.forEach(nm => {
    const v = T.indices[nm];
    series.push({name: nm+' 择时', color: colors[(ci++)%4], vals: v.nav || [], dash: false});
    series.push({name: nm+' 买入持有', color: colors[(ci++)%4], vals: v.nav_bh || [], dash: true});
  });
  const n = series[0].vals.length;
  const logs = [];
  series.forEach(s => s.vals.forEach(x => { if(x > 0) logs.push(Math.log(x)); }));
  if(!logs.length || n < 2){ el.innerHTML = ''; return; }
  const lo = Math.min(...logs), hi = Math.max(...logs);
  const X = i => L + i/(n-1)*(W-L-R);
  const Y = v => (v==null || v<=0 || !isFinite(v)) ? null : (TT + (H-TT-BB)*(1-(Math.log(v)-lo)/(hi-lo)));
  let svg = '';
  for(let k=0;k<=4;k++){
    const tv = lo + (hi-lo)*k/4, yy = TT + (H-TT-BB)*(1-(tv-lo)/(hi-lo));
    svg += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="#eef0f2"/>`;
    svg += `<text x="${L-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0a6">${Math.exp(tv).toFixed(1)}</text>`;
  }
  const dates = (T.indices[names[0]] || {}).dates || [];
  [0, Math.floor((n-1)/2), n-1].forEach((i,k)=>{
    svg += `<text x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="${k===0?'start':(k===2?'end':'middle')}" font-size="10" fill="#9aa0a6">${dates[i]||''}</text>`;
  });
  series.forEach(s => {
    let d = '', started = false;
    for(let i=0;i<s.vals.length;i++){ const yy = Y(s.vals[i]); if(yy==null) continue;
      d += (started?' L':'M') + X(i).toFixed(1) + ' ' + yy.toFixed(1); started = true; }
    if(d) svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.2:1.8}"${s.dash?' stroke-dasharray="4 3"':''}/>`;
  });
  el.innerHTML = svg;
  document.getElementById('timingLegend').innerHTML =
    series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
}

// ---------- 顶底极值 ----------
function renderExtreme(){
  const box = document.getElementById('extremeBox');
  const T = D.timing;
  if(!T || !T.indices) { if(box) box.style.display = 'none'; return; }
  const names = Object.keys(T.indices).filter(n => T.indices[n].ex);
  if(!names.length){ if(box) box.style.display = 'none'; return; }
  const rows = names.map(nm => {
    const e = T.indices[nm].ex;
    const risk = e.top_strong ? '<span class="up">强（动能+资金双弱）</span>'
               : (e.top_now ? '<span class="up">当日触发</span>'
               : (e.top_recent5 ? '<span style="color:#e97132">近5日触发</span>' : '无'));
    const bstate = e.bstate || '—';
    const cls = /底/.test(bstate) ? 'down' : (/顶/.test(bstate) ? 'up' : 'muted');
    return `<tr>
      <td>${nm}</td>
      <td class="w" style="font-weight:700">${e.score==null?'—':Number(e.score).toFixed(3)}</td>
      <td class="w">${e.score_pct==null?'—':(e.score_pct*100).toFixed(1)+'%'}</td>
      <td class="${cls}" style="font-weight:700">${bstate}</td>
      <td>${risk}</td>
      <td class="w muted">${e.last_risk || '—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('extremeTable').innerHTML =
    `<thead><tr><th>指数</th><th>底部得分</th><th>历史分位</th><th>位置状态</th>
      <th>顶部风险</th><th>最近顶部风险触发日</th></tr></thead><tbody>${rows}</tbody>`;
  drawExtremeChart(names);
}
function drawExtremeChart(names){
  const el = document.getElementById('extremeChart');
  if(!el) return;
  const T = D.timing;
  const axis = (T.indices[names[0]].ex || {}).dates || [];
  const n = axis.length;
  if(n < 2){ el.innerHTML = ''; return; }
  const W = Math.max(320, Math.round(el.clientWidth) || 860);
  const H = W < 560 ? 230 : 300;
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.style.height = H + 'px';
  const L = W<560?36:46, R = 12, TT = 14, BB = 26;
  const X = i => L + i/(n-1)*(W-L-R);
  const Y = v => TT + (H-TT-BB)*(1 - Math.min(Math.max(v,0),1));
  const colors = ['#156082','#c0392b','#2e7d32','#e07b00'];
  let svg = '';
  [[0.85,'#2e7d32','底部极值区'], [0.5,'#eef0f2',''], [0.15,'#c0392b','顶部极值区']].forEach(t => {
    const yy = Y(t[0]);
    svg += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="${t[1]}"${t[0]===0.5?'':' stroke-dasharray="4 3"'}/>`;
    if(t[2]) svg += `<text x="${L+4}" y="${(yy-3).toFixed(1)}" font-size="10" fill="${t[1]}">${t[2]}</text>`;
  });
  [0, 0.5, 1].forEach(k => {
    const yy = Y(k);
    svg += `<text x="${L-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#9aa0a6">${k.toFixed(1)}</text>`;
  });
  [0, Math.floor((n-1)/2), n-1].forEach((i,k)=>{
    svg += `<text x="${X(i).toFixed(1)}" y="${H-7}" text-anchor="${k===0?'start':(k===2?'end':'middle')}" font-size="10" fill="#9aa0a6">${axis[i]||''}</text>`;
  });
  names.forEach((nm, ci) => {
    const e = T.indices[nm].ex;
    let d = '', started = false;
    (e.bottom||[]).forEach((v, i) => { if(v==null) return;
      d += (started?' L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); started = true; });
    if(d) svg += `<path d="${d}" fill="none" stroke="${colors[ci%4]}" stroke-width="1.8"/>`;
    (e.risk_events||[]).forEach(dt => {
      const i = axis.indexOf(dt);
      if(i >= 0) svg += `<circle cx="${X(i).toFixed(1)}" cy="${(TT+6).toFixed(1)}" r="3" fill="#c0392b"/>`;
    });
  });
  el.innerHTML = svg;
  document.getElementById('extremeLegend').innerHTML =
    names.map((nm,ci)=>`<span><i style="background:${colors[ci%4]}"></i>${nm} 底部得分</span>`).join('')
    + `<span><i style="background:#c0392b"></i>顶部风险触发日</span>`;
}

// ---------- 交互 ----------
function quickRange(kind){
  const n = CD.dates.length; const e = CD.dates[n-1];
  let s;
  if(kind==='all') s = CD.dates[0];
  else if(kind==='ytd'){ const yy = e.slice(0,4); s = CD.dates.find(x => x.slice(0,4)===yy) || CD.dates[0]; }
  else if(kind==='1y') s = CD.dates[Math.max(0, n-1-247)];
  else if(kind==='3y') s = CD.dates[Math.max(0, n-1-741)];
  else if(kind==='5y') s = CD.dates[Math.max(0, n-1-1235)];
  $('cStart').value = s; $('cEnd').value = e; drawCurves();
}
(function init(){
  // 基准下拉
  $('benchSel').innerHTML = Object.keys(CD.bench||{}).map(c =>
    `<option value="${c}"${c===CD.default_bench?' selected':''}>${CD.bench_names[c]||c}</option>`).join('');
  // 默认区间：近1年
  const n = CD.dates.length;
  $('cStart').value = CD.dates[Math.max(0, n-1-247)];
  $('cEnd').value = CD.dates[n-1];
  $('pickDate').value = IND_DATES[IND_DATES.length-1];
  // 事件
  $('pickDate').addEventListener('change', ()=>renderSnapshot(val('pickDate')));
  $('bLatest').addEventListener('click', ()=>{ $('pickDate').value = IND_DATES[IND_DATES.length-1]; renderSnapshot(val('pickDate')); });
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', ()=>quickRange(b.dataset.q)));
  ['benchSel','viewSel','cStart','cEnd'].forEach(id => $(id).addEventListener('change', drawCurves));
  $('perfDate').addEventListener('change', renderPerf);
  let _rt; window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt = setTimeout(()=>{ drawCurves(); drawTiming(); drawExtremeChart(Object.keys((D.timing||{indices:{}}).indices).filter(n=>D.timing.indices[n].ex)); }, 150); });
  renderTiming();
  renderExtreme();
  renderSnapshot(val('pickDate'));
})();
</script>
